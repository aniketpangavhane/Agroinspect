global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: crop-advisor-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          environment: local
          service: crop-advisor
