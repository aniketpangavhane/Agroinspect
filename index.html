<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crop Recommendation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <style>
      body {
        background-color: #F5F5F5;
        color: #333333;
        font-family: 'Arial', sans-serif;
      }
      .navbar {
        background-color: #2C5F2D;
      }
      .navbar-brand, .nav-link {
        color: white !important;
      }
      h1 {
        color: #2C5F2D;
        text-align: center;
        font-weight: bold;
        margin-top: 20px;
        font-size: 2.5rem;
      }
      .form-label {
        font-weight: bold;
        color: #2C5F2D;
      }
      .form-control {
        border: 2px solid #97BC62;
        border-radius: 8px;
      }
      .btn-primary {
        background-color: #2C5F2D;
        border: none;
        padding: 10px 20px;
        font-size: 1.2rem;
        border-radius: 8px;
      }
      .btn-primary:hover {
        background-color: #97BC62;
      }
      .container {
        background-color: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        margin-top: 20px;
      }
      .card {
        margin: 20px auto;
        color: white;
        background-color: #2C5F2D;
        border-radius: 15px;
      }
      .card-body {
        text-align: center;
      }
      .card-title {
        font-size: 1.5rem;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <!--======================= Navbar ==============================-->
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Crop Recommendation</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Contact</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">About</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!--======================= Form ==============================-->
    <div class="container my-5">
      <h1>Crop Recommendation System <span>🌱</span></h1>
      <form action="/predict" method="POST">
        <div class="row">
          <div class="col-md-4 mb-3">
            <label for="Nitrogen" class="form-label">Nitrogen</label>
            <input type="number" id="Nitrogen" name="Nitrogen" placeholder="Enter Nitrogen" class="form-control" required step="0">
          </div>
          <div class="col-md-4 mb-3">
            <label for="Phosphorus" class="form-label">Phosphorus</label>
            <input type="number" id="Phosphorus" name="Phosphorus" placeholder="Enter Phosphorus" class="form-control" required step="0">
          </div>
          <div class="col-md-4 mb-3">
            <label for="Potassium" class="form-label">Potassium</label>
            <input type="number" id="Potassium" name="Potassium" placeholder="Enter Potassium" class="form-control" required step="0">
          </div>
        </div>

        <div class="row">
          <div class="col-md-4 mb-3">
            <label for="Ph" class="form-label">pH</label>
            <input type="number" step="0.01" id="Ph" name="Ph" placeholder="Enter pH value" class="form-control" required>
          </div>
        </div>

        <div class="row">
          <div class="col-md-12 text-center">
            <button type="submit" class="btn btn-primary btn-lg">Get Recommendation</button>
          </div>
        </div>
      </form>

      {% if result %}
        <div class="card bg-dark text-white" style="width: 18rem;">
          <img src="{{ url_for('static', filename='img/img.jpg') }}" class="card-img-top" alt="Recommended Crop">
          <div class="card-body">
            <h5 class="card-title">Recommended Crop:</h5>
            <p class="card-text">{{ result }}</p>
          </div>
        </div>
      {% endif %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
  </body>
</html>
